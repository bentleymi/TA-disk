[script://$SPLUNK_HOME/etc/apps/TA-disk/bin/disk_events.py]
interval = 600
index = main
sourcetype = disk:status
source = status
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-disk/bin/disk_metrics.py]
interval = 600
index = metrics
sourcetype = disk:metrics
source = metrics
disabled = 0
python.version = python3
python.required = 3.13

[script://$SPLUNK_HOME/etc/apps/TA-disk/bin/license_beacon.py]
interval = 3600
index = main
sourcetype = ta_license:status
source = ta_license:TA-disk
disabled = 0
python.version = python3
python.required = 3.13
