[disk:status]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TRUNCATE = 400000

[disk:metrics]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
DATETIME_CONFIG = CURRENT
TRUNCATE = 400000
TRANSFORMS-disk-metrics = disk_metric_name
METRIC-SCHEMA-TRANSFORMS = metric-schema:disk

[ta_license:status]
KV_MODE = json
NO_BINARY_CHECK = true
TRUNCATE = 20000
